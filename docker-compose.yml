services:
  postgres:
    image: postgres:16
    container_name: stock_predictor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stock_predictor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
