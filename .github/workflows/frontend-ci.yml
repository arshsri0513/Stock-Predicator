name: Frontend CI

# A successful Next.js build is itself a meaningful correctness check --
# it catches TypeScript type errors, missing imports, and broken JSX
# before any of that would reach a real deployment. We don't have a
# configured frontend test runner yet (see Phase 14's notes on the
# MetricCard test example, written but not wired into a real test
# command) -- this build check is what we DO have today, and it's
# genuinely useful on its own even without a full test suite alongside it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://placeholder-for-ci-build-only.example.com
        run: npm run build
